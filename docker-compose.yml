services:
  postgres:
    image: postgres:17-alpine
    container_name: jellywish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jellywish
      POSTGRES_PASSWORD: jellywish
      POSTGRES_DB: jellywish
    ports:
      - "5432:5432"
    volumes:
      - jellywish-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellywish -d jellywish"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jellywish-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - jellywish-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jellywish-pgdata:
  jellywish-redisdata:
